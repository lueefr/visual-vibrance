name: Build and Distribute Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
  release:
    types: [published]

jobs:
  validate-shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Validate shaderpack and Voxy integration
        run: python3 tools/validate_shaders.py

  zip-release:
    if: github.event_name == 'release'
    needs: validate-shaders
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v2
      - uses: vimtor/action-zip@v1.2
        with:
          files: LICENSE shaders/
          dest: "Visual-Vibrance-${{ github.event.release.tag_name }}.zip"
          recursive: false
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "Visual-Vibrance-${{ github.event.release.tag_name }}.zip"
          asset_name: "Visual-Vibrance-${{ github.event.release.tag_name }}.zip"
          tag: ${{ github.ref }}
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: l6Uqs2fS
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1244801
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: "Visual-Vibrance-${{ github.event.release.tag_name }}.zip"
          loaders: iris
          game-versions: ">=1.20"
